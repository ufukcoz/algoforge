name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/AlgoForge.sln

      - name: Build
        run: dotnet build backend/AlgoForge.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test backend/tests/AlgoForge.UnitTests/AlgoForge.UnitTests.csproj --no-build --configuration Release

      - name: Integration tests
        run: dotnet test backend/tests/AlgoForge.IntegrationTests/AlgoForge.IntegrationTests.csproj --no-build --configuration Release

  desktop-build:
    name: Desktop build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: npm install
        working-directory: desktop
        run: npm ci

      - name: TypeScript + Vite build
        working-directory: desktop
        run: npm run build

      - name: Electron installer build
        working-directory: desktop
        run: npm run electron:build

      - name: Installer artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: AlgoForge-Windows-Installer
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Docker image yayinla (ghcr.io)
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GitHub Container Registry'ye giris yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ve push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/algoforge-api:latest
